name: SIF DMA acceptance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build DMA regressions
        run: |
          cmake --build build --parallel 2 --target \
            iop_dma_icr_test \
            iop_dma_sif_channels_test \
            iop_dma_global_enable_test \
            iop_sif_mmio_link_test \
            sif1_dma_registers_test \
            sif1_ee_to_iop_test \
            sif1_dma_invalid_tags_test \
            sif1_ee_chain_test

      - name: Validate guest-visible DMA behavior
        run: |
          ctest --test-dir build --output-on-failure -R \
            '^(iop_dma_icr|iop_dma_sif_channels|iop_dma_global_enable|iop_sif_mmio_link|sif1_dma_registers|sif1_ee_to_iop|sif1_dma_invalid_tags|sif1_ee_chain)$'
