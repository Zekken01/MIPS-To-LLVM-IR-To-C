name: Native WebGPU build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-webgpu-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned native WebGPU SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party/wgpu-native
          curl --fail --location --retry 3 https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-linux-x86_64-release.zip -o "$RUNNER_TEMP/wgpu-native.zip"
          echo "95a4d90c071005a98d03eab348beaa6b07e16eb00d1dcdb9f8348f75eb97ec5a  $RUNNER_TEMP/wgpu-native.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/wgpu-native.zip" -d third_party/wgpu-native
      - name: Configure native-only WebGPU
        run: cmake -S . -B build/webgpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DEE_ENABLE_WEBGPU=ON -DEE_WEBGPU_ROOT="$GITHUB_WORKSPACE/third_party/wgpu-native"
      - name: Compile native runner and WebGPU pipelines
        run: cmake --build build/webgpu --target ee_game_runner --parallel 2

  native-webgpu-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned MSVC native WebGPU SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path third_party/wgpu-native | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'wgpu-native.zip'
          Invoke-WebRequest -Uri 'https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-windows-x86_64-msvc-release.zip' -OutFile $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '7e67d7445c42aeb85e30f88930fd8d7d83ee769e3390aeb1ada75ebf3cf78132') {
            throw 'wgpu-native binary archive checksum mismatch'
          }
          Expand-Archive -Path $archive -DestinationPath third_party/wgpu-native
      - name: Configure native-only MSVC WebGPU
        shell: pwsh
        run: cmake -S . -B build/webgpu -G "Visual Studio 17 2022" -A x64 -DEE_ENABLE_WEBGPU=ON "-DEE_WEBGPU_ROOT=$env:GITHUB_WORKSPACE/third_party/wgpu-native"
      - name: Compile native runner and WebGPU pipelines
        shell: pwsh
        run: cmake --build build/webgpu --target ee_game_runner --config Release --parallel 2
