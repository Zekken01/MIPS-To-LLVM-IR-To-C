name: Build and test

on:
  push:
    branches:
      - recovery/reassembled-source-2026-11-11
  pull_request:
    branches:
      - recovery/reassembled-source-2026-11-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check toolchain
        run: |
          cmake --version
          ninja --version
          c++ --version
          python3 --version

      - name: Install Python LLVM binding
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install llvmlite

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Upload real-game validation tools
        uses: actions/upload-artifact@v4
        with:
          name: ee-recomp-linux
          path: |
            build/ee_recomp
            tools/verify_ir.py
            tools/link_native_objects.py
            include/ee/
            src/runtime/
            src/ee/ee_dispatcher.cpp
            src/ee/recompiled_functions.cpp
          if-no-files-found: error
          retention-days: 1

      - name: Test
        run: ctest --test-dir build --output-on-failure
